# yaml-language-server: $schema=https://agentgateway.dev/schema/config
#
# Transparent access-plane example for Optimike MCP.
# Keep Optimike authentication enabled. Do not add automatic mutation retries.
gateways:
  optimike:
    port: 3100
    protocol: HTTP

routes:
  - name: optimike-complete-http-surface
    gateways: [optimike]
    matches:
      - path:
          pathPrefix: /
    backends:
      - host: 127.0.0.1:3101
