<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Route by effect, not by convenience</title>
  <desc id="description">The safest valid path depends on what must happen.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B87333"/>
    </marker>
  </defs>
  <style>
    .eyebrow,.meta,.pill{font-family:"JetBrains Mono","SFMono-Regular",Consolas,monospace;font-weight:700;letter-spacing:1.2px}
    .title{font-family:Newsreader,Georgia,serif;font-size:45px;font-weight:700;fill:#1A1A1A}
    .sectionTitle{font-family:Newsreader,Georgia,serif;font-size:34px;font-weight:700;fill:#F7F5F0}
    .subtitle{font-family:"DM Sans",Inter,Arial,sans-serif;font-size:19px;fill:#2E5A7C}
    .eyebrow{font-size:14px;fill:#B87333}
    .meta{font-size:13px;fill:#2E5A7C}
    .label{font-family:"DM Sans",Inter,Arial,sans-serif;font-size:18px;font-weight:700;fill:#1A1A1A}
    .body{font-family:"DM Sans",Inter,Arial,sans-serif;font-size:17px;fill:#1A1A1A}
    .small{font-family:"DM Sans",Inter,Arial,sans-serif;font-size:15px;fill:#2E5A7C}
    .pill{font-size:12px}
    .inverse{fill:#F7F5F0}
    .accent{fill:#B87333}
    .positive{fill:#4A7C59}
  </style>
  <rect width="1200" height="630" fill="#F7F5F0"/>
  <rect x="0" y="0" width="16" height="630" fill="#B87333"/>
  <text x="54" y="40" class="eyebrow" text-anchor="start">OPTIMIKE · OBSIDIAN MCP</text>
  <text x="1148" y="40" class="eyebrow" text-anchor="end">06</text>
  <text x="54" y="92" class="title" text-anchor="start">Route by effect, not by convenience</text>
  <text x="54" y="122" class="subtitle" text-anchor="start">The safest valid path depends on what must happen.</text>

  <rect x="54" y="164" width="1094" height="56" rx="18" fill="#131316" stroke="#131316" stroke-width="2"/>
  <text x="601" y="199" class="eyebrow" text-anchor="middle">WHAT DO YOU NEED?</text>
  <line x1="420" y1="220" x2="290" y2="266" stroke="#B87333" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="780" y1="220" x2="910" y2="266" stroke="#B87333" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="54" y="266" width="470" height="94" rx="18" fill="#EFEDE8" stroke="#E0DCD4" stroke-width="2"/>
  <text x="78" y="302" class="label" text-anchor="start">Vault knowledge</text>
  <rect x="78" y="316" width="150" height="34" rx="17" fill="#2E5A7C" stroke="#2E5A7C" stroke-width="0"/>
  <text x="153" y="338" class="pill" fill="#F7F5F0" text-anchor="middle">Read / search</text>
  <text x="496" y="323" class="small" text-anchor="end">stdio or HTTP</text>
  <rect x="676" y="266" width="472" height="94" rx="18" fill="#EFEDE8" stroke="#E0DCD4" stroke-width="2"/>
  <text x="700" y="302" class="label" text-anchor="start">External file</text>
  <rect x="700" y="316" width="130" height="34" rx="17" fill="#2E5A7C" stroke="#2E5A7C" stroke-width="0"/>
  <text x="765" y="338" class="pill" fill="#F7F5F0" text-anchor="middle">List / read</text>
  <line x1="910" y1="360" x2="782" y2="404" stroke="#B87333" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="910" y1="360" x2="1016" y2="404" stroke="#B87333" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="558" y="404" width="276" height="116" rx="18" fill="#EFEDE8" stroke="#E0DCD4" stroke-width="2"/>
  <text x="582" y="436" class="meta" text-anchor="start">Temporary copy</text>
  <text x="582" y="474" class="label" text-anchor="start">stdio → local_path</text>
  <text x="582" y="501" class="small" text-anchor="start">HTTP → http_ticket</text>
  <rect x="858" y="404" width="290" height="116" rx="18" fill="#EFEDE8" stroke="#B87333" stroke-width="2"/>
  <text x="882" y="436" class="meta" text-anchor="start">Move + repair links</text>
  <text x="882" y="474" class="label" text-anchor="start">stdio + headless-filesystem</text>
  <text x="882" y="501" class="small" text-anchor="start">gates · CAS · journal · rollback</text>
  <text x="54" y="548" class="small" text-anchor="start">Reads and handoff stay default-deny; move requires explicit gates</text>
  <line x1="54" y1="590" x2="1148" y2="590" stroke="#E0DCD4" stroke-width="2"/>
  <text x="54" y="614" class="meta" text-anchor="start">optimike-obsidian-mcp</text>
  <text x="1148" y="614" class="meta" text-anchor="end">EN</text>
</svg>
