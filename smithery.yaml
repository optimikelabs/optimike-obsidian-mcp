build:
  dockerBuildPath: .
startCommand:
  type: stdio
  configSchema:
    type: object
    required: []
    properties:
      obsidianRuntimeMode:
        type: string
        default: live
        enum:
          - live
          - hybrid
          - headless-readonly
          - headless-guarded
          - headless-filesystem
        description: Runtime contract. live requires obsidianApiKey; headless modes require obsidianVault.
      obsidianApiKey:
        type: string
        description: Obsidian Local REST API key. Required for live REST tools.
      obsidianBaseUrl:
        type: string
        format: uri
        default: http://127.0.0.1:27123
        description: Base URL of the Obsidian Local REST API plugin.
      obsidianVault:
        type: string
        description: Local vault path for headless modes or hybrid without an API key.
      obsidianCacheSource:
        type: string
        default: auto
        enum:
          - auto
          - rest
          - filesystem
        description: Cache refresh source.
      smartEnvDir:
        type: string
        description: Optional Smart Connections .smart-env path for semantic search.
      mcpWriteMode:
        type: string
        enum:
          - readonly
          - guarded
          - full
        description: Optional server-side write policy override.
  commandFunction: |
    (config) => {
      const env = {
        OBSIDIAN_RUNTIME_MODE: config.obsidianRuntimeMode || 'live',
        OBSIDIAN_BASE_URL: config.obsidianBaseUrl || 'http://127.0.0.1:27123',
        OBSIDIAN_CACHE_SOURCE: config.obsidianCacheSource || 'auto',
        MCP_TRANSPORT_TYPE: 'stdio',
        MCP_LOG_LEVEL: 'info',
        OBSIDIAN_VERIFY_SSL: 'false'
      };
      if (config.obsidianApiKey) env.OBSIDIAN_API_KEY = config.obsidianApiKey;
      if (config.obsidianVault) env.OBSIDIAN_VAULT = config.obsidianVault;
      if (config.smartEnvDir) env.SMART_ENV_DIR = config.smartEnvDir;
      if (config.mcpWriteMode) env.MCP_WRITE_MODE = config.mcpWriteMode;
      return {
        command: 'npx',
        args: ['optimike-obsidian-mcp'],
        env
      };
    }
