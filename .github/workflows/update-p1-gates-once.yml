name: Update P1 gates once

on:
  push:
    branches: [feat/governed-frontmatter-p1]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-p1-gates-once
  cancel-in-progress: false

jobs:
  update:
    if: github.actor == 'optimikelabs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/governed-frontmatter-p1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Integrate and verify permanent gates
        run: |
          python scripts/update-p1-gates.py
          npx prettier --write package.json scripts/test-governed-frontmatter-doc-contract.mjs scripts/test-package-contents.mjs scripts/test-frontmatter-p1-idempotency.mjs
          npm run build
          node scripts/test-frontmatter-p1-idempotency.mjs
          node scripts/test-governed-frontmatter-doc-contract.mjs
      - name: Commit non-workflow gate changes
        run: |
          rm scripts/update-p1-gates.py
          git config user.name "optimikelabs-p1"
          git config user.email "31423109+optimikelabs@users.noreply.github.com"
          git add package.json scripts
          git commit -m "test(p1): make cross-process identity a permanent gate"
          git push origin HEAD:feat/governed-frontmatter-p1
