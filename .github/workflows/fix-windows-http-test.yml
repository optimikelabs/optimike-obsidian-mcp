name: Fix Windows governed HTTP test

on:
  push:
    branches:
      - feat/2.6.0-governed-note-replace

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/2.6.0-governed-note-replace
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply bounded listener-race fix
        shell: bash
        env:
          OLD_1: ICBhd2FpdCB0aGlyZC5jbG9zZSgpOwogIHRoaXJkID0gdW5kZWZpbmVkOwogIGJhY2tlbmQua2lsbCgiU0lHVEVSTSIpOwogIGNvbnN0IGV4aXRDb2RlID0gYXdhaXQgbmV3IFByb21pc2UoKHJlc29sdmUpID0+CiAgICBiYWNrZW5kLm9uY2UoImV4aXQiLCAoY29kZSkgPT4gcmVzb2x2ZShjb2RlKSksCiAgKTsKICBhc3NlcnQuZXF1YWwoZXhpdENvZGUsIDApOwo=
          NEW_1: 
          OLD_2: 
          NEW_2: 
        run: |
          set -euo pipefail
          python - <<'PY'
          from base64 import b64decode
          from pathlib import Path
          import os

          path = Path('scripts/test-governed-note-replace-http.mjs')
          text = path.read_text()
          for index in ('1', '2'):
              old = b64decode(os.environ[f'OLD_{index}']).decode()
              new = b64decode(os.environ[f'NEW_{index}']).decode()
              assert text.count(old) == 1, f'expected one bounded replacement for block {index}'
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          node --check scripts/test-governed-note-replace-http.mjs
          git diff --check
      - run: npm ci
      - run: npm run build
      - run: node scripts/test-governed-note-replace-http.mjs
      - name: Commit test-only fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/test-governed-note-replace-http.mjs
          git diff --cached --check
          git commit -m "test(ci): fix Windows process-exit listener race"
          git push origin HEAD:feat/2.6.0-governed-note-replace
