name: Temporary M5 package union
on:
  pull_request:
    paths: ['.github/workflows/prepare-m5-package.yml']
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'optimikelabs/optimike-obsidian-mcp' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/m5-p7-base-rows'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const {data}=await github.rest.repos.getContent({...context.repo,path:'package.json',ref:context.payload.pull_request.head.sha});
            if(data.sha!=='9bd9830fa0acac333ddea8d3400116238ae6f7a9'||data.encoding!=='base64')throw new Error('Stale package');
            const text=Buffer.from(data.content,'base64').toString('utf8'),anchor='    "docs/native-note-move-m3.md",';
            if(text.split(anchor).length!==2)throw new Error('Ambiguous package');
            const next=text.replace(anchor,anchor+'\n    "docs/durable-note-create-m4.md",');
            const old=JSON.parse(text),p=JSON.parse(next);
            if(p.files.length!==old.files.length+1||!p.files.includes('docs/base-row-patch-m5.md')||!p.files.includes('docs/durable-note-create-m4.md'))throw new Error('Lost package entry');
            const blob=await github.rest.git.createBlob({...context.repo,content:next,encoding:'utf-8'});
            core.notice('M5_PACKAGE_BLOB '+blob.data.sha);
            core.notice('Only object prepared; no branch changed. Remove both temporary workflows and the ABA recipe when attaching.');
