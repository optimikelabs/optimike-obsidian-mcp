name: Apply sealed M3 surface checkpoint
on:
  pull_request:
    paths: ['.github/workflows/apply-m3-surface.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'optimikelabs/optimike-obsidian-mcp' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/m3-native-note-move'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const crypto = require('node:crypto');
            const repo = context.repo;
            const branch = 'feat/m3-native-note-move';
            const head = context.payload.pull_request.head.sha;
            const staged = 'a20204150f29139205053acf60d3c78b724b9dd4';
            const workflow = '.github/workflows/apply-m3-surface.yml';
            const recipes = [1,2,3].map(n => `docs/cycle-20260920/m3-surface-part${n}.json`);
            const allowed = new Set([
              'src/mcp-server/toolSurfaceRegistry.ts','src/mcp-server/toolProfiles.ts',
              'scripts/test-tool-surface-registry.mjs','scripts/test-tool-profiles.mjs','scripts/test-tool-catalog.mjs',
              'package.json','.github/workflows/runtime.yml','evals/tool-catalog.v1.json',
              'README.md','README.fr.md','docs/tool-surface-profiles.md','docs/tool-surface-profiles.fr.md',
              'docs/obsidian_mcp_tools_spec.md','scripts/test-doc-contract.mjs','scripts/test-operation-cockpit-doc-contract.mjs',
              'docs/runtime-capability-matrix.md','docs/runtime-capability-matrix.fr.md',
              'src/services/capabilityManifest.ts','scripts/test-capability-manifest.mjs',
            ]);
            const hash = text => {
              const b=Buffer.from(text,'utf8');
              return crypto.createHash('sha1').update(`blob ${b.length}\0`).update(b).digest('hex');
            };
            const current = async () => (await github.rest.git.getRef({...repo,ref:'heads/'+branch})).data.object.sha;
            const read = async p => {
              const {data}=await github.rest.repos.getContent({...repo,path:p,ref:head});
              if(Array.isArray(data)||data.type!=='file'||data.encoding!=='base64'||data.size>300000)throw new Error('Unsupported input');
              const b=Buffer.from(data.content,'base64'); const text=b.toString('utf8');
              if(!b.equals(Buffer.from(text,'utf8'))||hash(text)!==data.sha)throw new Error('Input integrity mismatch');
              return {text,sha:data.sha};
            };
            if(await current()!==head)throw new Error('Concurrent branch update');
            const parent=(await github.rest.git.getCommit({...repo,commit_sha:head})).data;
            if(parent.parents.length!==1||parent.parents[0].sha!==staged)throw new Error('Unexpected staging ancestry');
            const delta=(await github.rest.repos.compareCommitsWithBasehead({...repo,basehead:staged+'...'+head})).data;
            if(delta.files.length!==1||delta.files[0].filename!==workflow)throw new Error('Unexpected product drift');
            const entries=[];const seen=new Set();
            for(const recipe of recipes){
              const r=JSON.parse((await read(recipe)).text);
              if(r.version!==1||!Array.isArray(r.files)||r.files.length>19)throw new Error('Invalid recipe');
              for(const f of r.files){
                if(!allowed.has(f.path)||seen.has(f.path)||!Array.isArray(f.replacements)||f.replacements.length>16)throw new Error('Invalid target');
                seen.add(f.path);
                const old=await read(f.path);if(old.sha!==f.beforeSha)throw new Error('Stale input: '+f.path);
                let text=old.text;
                for(const p of f.replacements){
                  if(typeof p.before!=='string'||!p.before||typeof p.after!=='string')throw new Error('Invalid literal edit');
                  // Repair a transcription-only label omission in the saved recipe; output remains hash sealed.
                  const fix=s=>f.path==='docs/tool-surface-profiles.fr.md'?s.replace('Surface complète explicite du runtime actif','Surface complète/admin explicite du runtime actif'):s;
                  const before=fix(p.before),after=fix(p.after),n=p.count??1;
                  if(!Number.isInteger(n)||n<1||n>10)throw new Error('Invalid occurrence count');
                  const parts=text.split(before);if(parts.length!==n+1)throw new Error('Ambiguous anchor: '+f.path);
                  text=parts.join(after);
                }
                if(Buffer.byteLength(text,'utf8')>300000||hash(text)!==f.afterSha)throw new Error('Output integrity mismatch: '+f.path);
                entries.push({path:f.path,mode:'100644',type:'blob',content:text});
              }
            }
            if(seen.size!==allowed.size)throw new Error('Incomplete checkpoint');
            for(const p of [...recipes,workflow])entries.push({path:p,mode:'100644',type:'blob',sha:null});
            const tree=(await github.rest.git.createTree({...repo,base_tree:parent.tree.sha,tree:entries})).data;
            const next=(await github.rest.git.createCommit({...repo,message:'feat(m3): integrate declared lifecycle, capability diagnostics and cross-platform gates',tree:tree.sha,parents:[head]})).data;
            if(await current()!==head)throw new Error('Concurrent update; no branch change');
            await github.rest.git.updateRef({...repo,ref:'heads/'+branch,sha:next.sha,force:false});
            if(await current()!==next.sha)throw new Error('Remote verification failed');
            core.notice('M3 surface checkpoint: '+next.sha);
