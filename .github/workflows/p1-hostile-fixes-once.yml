name: Apply P1 hostile-review fixes once

on:
  push:
    branches: [feat/governed-frontmatter-p1]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p1-hostile-fixes-once
  cancel-in-progress: false

jobs:
  fix:
    if: github.actor == 'optimikelabs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/governed-frontmatter-p1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Apply bounded hostile-review fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          def regex_once(path: str, pattern: str, replacement: str) -> None:
              file = Path(path)
              content = file.read_text(encoding="utf-8")
              updated, count = re.subn(pattern, replacement, content, count=1, flags=re.MULTILINE)
              if count != 1:
                  raise SystemExit(f"{path}: expected one regex anchor, found {count}: {pattern}")
              file.write_text(updated, encoding="utf-8")

          adapter = "src/services/operations/obsidianNoteReplaceOperationAdapter.ts"
          regex_once(
              adapter,
              r'''    requestDigest: plan\.requestDigest,\n    idempotencyIdentity: plan\.idempotencyIdentity \?\? null,\n    projectionDigest: plan\.projection \? operationDigest\(plan\.projection\) : null,''',
              '''    requestDigest: plan.requestDigest,
              ...(plan.idempotencyIdentity
                ? { idempotencyIdentity: plan.idempotencyIdentity }
                : {}),
              ...(plan.projection
                ? { projectionDigest: operationDigest(plan.projection) }
                : {}),''',
          )
          regex_once(
              adapter,
              r'''      bindingFingerprint: read\.bindingFingerprint,\n      idempotencyIdentity: input\.idempotencyIdentity \?\? null,\n      projectionDigest: input\.projection\n        \? operationDigest\(input\.projection\)\n        : null,''',
              '''      bindingFingerprint: read.bindingFingerprint,
              ...(input.idempotencyIdentity
                ? { idempotencyIdentity: input.idempotencyIdentity }
                : {}),
              ...(input.projection
                ? { projectionDigest: operationDigest(input.projection) }
                : {}),''',
          )

          runtime = Path("src/services/frontmatterProjectionRuntime.ts")
          content = runtime.read_text(encoding="utf-8")
          policy_pattern = re.compile(
              r'''\n    assertWriteAllowed\(\{\n      operation: "obsidian_frontmatter_patch_plan",\n      action: "plan",\n      target: input\.path,\n      targetType: "filePath",\n      batchCount: operations\.length,\n      frontmatterKeys: operations\.map\(\(operation\) => operation\.key\),\n    \}\);\n'''
          )
          if len(policy_pattern.findall(content)) != 1:
              raise SystemExit("frontmatter runtime: expected one plan policy block")
          content = policy_pattern.sub("\n", content, count=1)
          anchor = "    const internalKey = internalIdempotencyKey(publicKey);\n"
          if content.count(anchor) != 1:
              raise SystemExit("frontmatter runtime: expected one internal-key anchor")
          policy = '''    const internalKey = internalIdempotencyKey(publicKey);
              assertWriteAllowed({
                operation: "obsidian_frontmatter_patch_plan",
                action: "plan",
                target: input.path,
                targetType: "filePath",
                batchCount: operations.length,
                frontmatterKeys: operations.map((operation) => operation.key),
              });
          '''
          runtime.write_text(content.replace(anchor, policy, 1), encoding="utf-8")

          compiler = Path("src/services/frontmatterPatchCompiler.ts")
          content = compiler.read_text(encoding="utf-8")
          content, count = re.subn(
              r'''type SourceEntry = \{\n  key: string;\n  normalizedKey: string;\n  start: number;\n  end: number;\n\};''',
              '''type SourceEntry = {
              key: string;
              normalizedKey: string;
              start: number;
              end: number;
              trailingCommentIsAmbiguous: boolean;
            };''',
              content,
              count=1,
          )
          if count != 1:
              raise SystemExit("compiler: expected SourceEntry anchor")
          old = '''    const end = lines[lastOwnedLineIndex]?.endWithEol ?? startLine.endWithEol;
              entries.set(start.normalizedKey, {
                key: start.key,
                normalizedKey: start.normalizedKey,
                start: startLine.start,
                end,
              });'''
          if content.count(old) != 1:
              raise SystemExit("compiler: expected entry range anchor")
          content = content.replace(
              old,
              '''    const end = lines[lastOwnedLineIndex]?.endWithEol ?? startLine.endWithEol;
              const trailingCommentIsAmbiguous = lines
                .slice(lastOwnedLineIndex + 1, nextStartLineIndex)
                .some((line) => line.text.startsWith("#"));
              entries.set(start.normalizedKey, {
                key: start.key,
                normalizedKey: start.normalizedKey,
                start: startLine.start,
                end,
                trailingCommentIsAmbiguous,
              });''',
              1,
          )
          old = '''      edits.push({
                key: entry.key,
                operation: "delete",
                start: entry.start,
                end: entry.end,
                replacement: "",
              });'''
          if content.count(old) != 1:
              raise SystemExit("compiler: expected delete anchor")
          content = content.replace(
              old,
              '''      if (entry.trailingCommentIsAmbiguous) {
                fail(
                  "Cannot delete a key followed by comments with ambiguous ownership.",
                  { reason: "ambiguous_delete_comment", key: operation.key },
                );
              }
              edits.push({
                key: entry.key,
                operation: "delete",
                start: entry.start,
                end: entry.end,
                replacement: "",
              });''',
              1,
          )
          compiler.write_text(content, encoding="utf-8")

          test = Path("scripts/test-frontmatter-p1-compiler.mjs")
          content = test.read_text(encoding="utf-8")
          anchor = '''  [
              "frontmatter_key_missing",
              () =>
                compileFrontmatterPatch("---\\na: 1\\n---\\n", [
                  { op: "delete", key: "missing" },
                ]),
            ],'''
          if content.count(anchor) != 1:
              raise SystemExit("compiler test: expected missing-key anchor")
          content = content.replace(
              anchor,
              '''  [
              "ambiguous_delete_comment",
              () =>
                compileFrontmatterPatch(
                  "---\\na: 1\\n# could belong to a or b\\nb: 2\\n---\\n",
                  [{ op: "delete", key: "a" }],
                ),
            ],
          ''' + anchor,
              1,
          )
          test.write_text(content, encoding="utf-8")

      - name: Format and verify
        run: |
          npx prettier --write \
            src/services/operations/obsidianNoteReplaceOperationAdapter.ts \
            src/services/frontmatterProjectionRuntime.ts \
            src/services/frontmatterPatchCompiler.ts \
            scripts/test-frontmatter-p1-compiler.mjs
          node scripts/test-governed-frontmatter-model.mjs
          npm run build
          node scripts/test-frontmatter-p1-compiler.mjs
          node scripts/test-governed-frontmatter-mcp.mjs
          node scripts/test-governed-frontmatter-http.mjs

      - name: Remove one-shot workflow and trigger
        run: rm .github/workflows/p1-hostile-fixes-once.yml scripts/.p1-seam-trigger

      - name: Commit fixes
        run: |
          git config user.name "optimikelabs-p1"
          git config user.email "31423109+optimikelabs@users.noreply.github.com"
          git add src scripts .github/workflows/p1-hostile-fixes-once.yml
          git commit -m "fix(p1): preserve P0 digests and fail closed on comment ownership"
          git push origin HEAD:feat/governed-frontmatter-p1
