name: Apply P1 hostile-review fixes once

on:
  push:
    branches: [feat/governed-frontmatter-p1]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p1-hostile-fixes-once
  cancel-in-progress: false

jobs:
  fix:
    if: github.actor == 'optimikelabs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/governed-frontmatter-p1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Apply bounded hostile-review fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              content = file.read_text(encoding="utf-8")
              count = content.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one anchor, found {count}")
              file.write_text(content.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "src/services/operations/obsidianNoteReplaceOperationAdapter.ts",
              '''    requestDigest: plan.requestDigest,
              idempotencyIdentity: plan.idempotencyIdentity ?? null,
              projectionDigest: plan.projection ? operationDigest(plan.projection) : null,
            });''',
              '''    requestDigest: plan.requestDigest,
              ...(plan.idempotencyIdentity
                ? { idempotencyIdentity: plan.idempotencyIdentity }
                : {}),
              ...(plan.projection
                ? { projectionDigest: operationDigest(plan.projection) }
                : {}),
            });''',
          )
          replace_once(
              "src/services/operations/obsidianNoteReplaceOperationAdapter.ts",
              '''      bindingFingerprint: read.bindingFingerprint,
              idempotencyIdentity: input.idempotencyIdentity ?? null,
              projectionDigest: input.projection
                ? operationDigest(input.projection)
                : null,
            });''',
              '''      bindingFingerprint: read.bindingFingerprint,
              ...(input.idempotencyIdentity
                ? { idempotencyIdentity: input.idempotencyIdentity }
                : {}),
              ...(input.projection
                ? { projectionDigest: operationDigest(input.projection) }
                : {}),
            });''',
          )

          runtime = Path("src/services/frontmatterProjectionRuntime.ts")
          text = runtime.read_text(encoding="utf-8")
          policy = '''    assertWriteAllowed({
              operation: "obsidian_frontmatter_patch_plan",
              action: "plan",
              target: input.path,
              targetType: "filePath",
              batchCount: operations.length,
              frontmatterKeys: operations.map((operation) => operation.key),
            });

          '''
          if text.count(policy) != 1:
              raise SystemExit(f"frontmatter runtime: expected one policy block, found {text.count(policy)}")
          text = text.replace(policy, "", 1)
          anchor = '''    const internalKey = internalIdempotencyKey(publicKey);
            const existing = this.noteRuntime.findPlanByIdempotencyKey(internalKey);'''
          replacement = '''    const internalKey = internalIdempotencyKey(publicKey);
            assertWriteAllowed({
              operation: "obsidian_frontmatter_patch_plan",
              action: "plan",
              target: input.path,
              targetType: "filePath",
              batchCount: operations.length,
              frontmatterKeys: operations.map((operation) => operation.key),
            });
            const existing = this.noteRuntime.findPlanByIdempotencyKey(internalKey);'''
          if text.count(anchor) != 1:
              raise SystemExit(f"frontmatter runtime: expected one idempotency anchor, found {text.count(anchor)}")
          runtime.write_text(text.replace(anchor, replacement, 1), encoding="utf-8")

          compiler = Path("src/services/frontmatterPatchCompiler.ts")
          text = compiler.read_text(encoding="utf-8")
          text = text.replace(
              '''type SourceEntry = {
              key: string;
              normalizedKey: string;
              start: number;
              end: number;
            };''',
              '''type SourceEntry = {
              key: string;
              normalizedKey: string;
              start: number;
              end: number;
              trailingCommentIsAmbiguous: boolean;
            };''',
              1,
          )
          old_entry = '''    const end = lines[lastOwnedLineIndex]?.endWithEol ?? startLine.endWithEol;
              entries.set(start.normalizedKey, {
                key: start.key,
                normalizedKey: start.normalizedKey,
                start: startLine.start,
                end,
              });'''
          new_entry = '''    const end = lines[lastOwnedLineIndex]?.endWithEol ?? startLine.endWithEol;
              const trailingCommentIsAmbiguous = lines
                .slice(lastOwnedLineIndex + 1, nextStartLineIndex)
                .some((line) => line.text.startsWith("#"));
              entries.set(start.normalizedKey, {
                key: start.key,
                normalizedKey: start.normalizedKey,
                start: startLine.start,
                end,
                trailingCommentIsAmbiguous,
              });'''
          if text.count(old_entry) != 1:
              raise SystemExit(f"compiler: expected one entry range anchor, found {text.count(old_entry)}")
          text = text.replace(old_entry, new_entry, 1)
          old_delete = '''      edits.push({
                key: entry.key,
                operation: "delete",
                start: entry.start,
                end: entry.end,
                replacement: "",
              });'''
          new_delete = '''      if (entry.trailingCommentIsAmbiguous) {
                fail(
                  "Cannot delete a key followed by comments with ambiguous ownership.",
                  { reason: "ambiguous_delete_comment", key: operation.key },
                );
              }
              edits.push({
                key: entry.key,
                operation: "delete",
                start: entry.start,
                end: entry.end,
                replacement: "",
              });'''
          if text.count(old_delete) != 1:
              raise SystemExit(f"compiler: expected one delete anchor, found {text.count(old_delete)}")
          compiler.write_text(text.replace(old_delete, new_delete, 1), encoding="utf-8")

          test = Path("scripts/test-frontmatter-p1-compiler.mjs")
          text = test.read_text(encoding="utf-8")
          anchor = '''  [
              "frontmatter_key_missing",
              () =>
                compileFrontmatterPatch("---\\na: 1\\n---\\n", [
                  { op: "delete", key: "missing" },
                ]),
            ],'''
          addition = '''  [
              "ambiguous_delete_comment",
              () =>
                compileFrontmatterPatch(
                  "---\\na: 1\\n# could belong to a or b\\nb: 2\\n---\\n",
                  [{ op: "delete", key: "a" }],
                ),
            ],
          ''' + anchor
          if text.count(anchor) != 1:
              raise SystemExit(f"compiler test: expected one missing-key anchor, found {text.count(anchor)}")
          test.write_text(text.replace(anchor, addition, 1), encoding="utf-8")

      - name: Format and verify
        run: |
          npx prettier --write \
            src/services/operations/obsidianNoteReplaceOperationAdapter.ts \
            src/services/frontmatterProjectionRuntime.ts \
            src/services/frontmatterPatchCompiler.ts \
            scripts/test-frontmatter-p1-compiler.mjs
          node scripts/test-governed-frontmatter-model.mjs
          npm run build
          node scripts/test-frontmatter-p1-compiler.mjs
          node scripts/test-governed-frontmatter-mcp.mjs
          node scripts/test-governed-frontmatter-http.mjs

      - name: Remove one-shot workflow and trigger
        run: rm .github/workflows/p1-hostile-fixes-once.yml scripts/.p1-seam-trigger

      - name: Commit fixes
        run: |
          git config user.name "optimikelabs-p1"
          git config user.email "31423109+optimikelabs@users.noreply.github.com"
          git add src scripts .github/workflows/p1-hostile-fixes-once.yml
          git commit -m "fix(p1): preserve P0 digests and fail closed on comment ownership"
          git push origin HEAD:feat/governed-frontmatter-p1
