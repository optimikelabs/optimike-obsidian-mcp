name: Recover interrupted checkpoint (read-only)
on:
  pull_request:
    paths: ['.github/workflows/recover-interrupted-checkpoint.yml']
permissions:
  contents: read
jobs:
  recover:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/m3-native-note-move'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const crypto = require('node:crypto');
            const shas = [
              '4982c7be1a1af7d0c69089419cad8d2c7be05016',
              '8f85c23e7b5061cbd52dc63443a71ac061b88e10',
              'cda9b7be2f172aef9b44dca08da93b08a3dd0b65',
              'c72013ecf86783f8d3d3634fc589c6ce934fdd44',
              '219777ae6e497f7bdc5dfb8410f882469f654f71',
              '6ec31574610deaee73b665ddcd4470ee1e6d3e88',
              'cdbed6a235a847bf8802d4f63271d409f0872fe5',
              'c02d66d7cb0b9f49f88ef5acc57f44de5a6e5d7e',
              '8b167625a64f928e7a57c51f20c02d7a5007c126',
              '956cf0150465520cad156750f0c12a63e6395b76',
              '054a0b9e4d9ee1e4b1ce143bab26f3239d5a435e',
            ];
            let encoded = '';
            const manifest = [];
            for (const sha of shas) {
              const {data} = await github.rest.git.getBlob({...context.repo, file_sha: sha});
              const bytes = Buffer.from(data.content, 'base64');
              const actual = crypto.createHash('sha1').update(`blob ${bytes.length}\0`).update(bytes).digest('hex');
              if (actual !== sha) throw new Error('Blob integrity mismatch');
              const text = bytes.toString('utf8');
              if (!/^[A-Za-z0-9+/=]+$/.test(text)) throw new Error('Unexpected recovery encoding');
              encoded += text;
              if (encoded.length > 2000000) throw new Error('Recovery input bound exceeded');
              manifest.push({sha, bytes: bytes.length});
            }
            fs.writeFileSync(process.env.RUNNER_TEMP + '/recovered.zst', Buffer.from(encoded, 'base64'));
            fs.writeFileSync(process.env.RUNNER_TEMP + '/recovery-manifest.json', JSON.stringify(manifest, null, 2));
      - name: Inspect frame only; never execute recovered content
        shell: bash
        run: |
          set -uo pipefail
          ulimit -f 20480
          zstd --test "$RUNNER_TEMP/recovered.zst" > "$RUNNER_TEMP/frame-validation.txt" 2>&1
          status=$?
          echo "frame_validation_exit=$status"
          zstd -dc "$RUNNER_TEMP/recovered.zst" > "$RUNNER_TEMP/recovered.payload" 2>> "$RUNNER_TEMP/frame-validation.txt" || true
          wc -c "$RUNNER_TEMP/recovered.payload"
          file "$RUNNER_TEMP/recovered.payload"
      - uses: actions/upload-artifact@v4
        with:
          name: interrupted-checkpoint-recovery
          path: |
            ${{ runner.temp }}/recovered.zst
            ${{ runner.temp }}/recovered.payload
            ${{ runner.temp }}/recovery-manifest.json
            ${{ runner.temp }}/frame-validation.txt
          retention-days: 3
          if-no-files-found: error
