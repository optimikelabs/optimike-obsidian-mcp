name: Finalize 2.6.0 packaged docs once

on:
  push:
    branches: [release/2.6.0]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-release-docs-2.6.0
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor == 'optimikelabs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/2.6.0
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Update released-state wording
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              content = file.read_text(encoding="utf-8")
              count = content.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one wording anchor, found {count}")
              file.write_text(content.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "docs/governed-note-replacement.md",
              "The 2.6 candidate exposes the first public non-Operon mutation backed by the\ncommon operation-runtime vocabulary.",
              "Optimike Obsidian MCP 2.6.0 exposes the first public non-Operon mutation backed by the\ncommon operation-runtime vocabulary.",
          )
          replace_once(
              "docs/governed-note-replacement.md",
              "This\nlive Desktop gate passed on 2026-08-14 with the final SHA-256 equal to the\npre-mutation SHA-256. Merge, versioning, and release remain separate\nrepository-authority decisions.",
              "This\nlive Desktop gate passed on 2026-08-14 with the final SHA-256 equal to the\npre-mutation SHA-256. These guarantees are released in Optimike Obsidian MCP\n2.6.0; later capability paliers remain separate repository-authority decisions.",
          )
          replace_once(
              "docs/governed-note-replacement.fr.md",
              "Le candidat 2.6 expose la première mutation publique non-Operon appuyée sur le\nvocabulaire du runtime commun.",
              "Optimike Obsidian MCP 2.6.0 expose la première mutation publique non-Operon appuyée sur le\nvocabulaire du runtime commun.",
          )
          replace_once(
              "docs/governed-note-replacement.fr.md",
              "Cette gate Desktop live a réussi le 2026-08-14,\navec un SHA-256 final identique au SHA-256 avant mutation. Merge, version et\nrelease restent des décisions séparées de l’autorité du dépôt.",
              "Cette gate Desktop live a réussi le 2026-08-14,\navec un SHA-256 final identique au SHA-256 avant mutation. Ces garanties sont\npubliées dans Optimike Obsidian MCP 2.6.0 ; les paliers de capacités suivants\nrestent des décisions séparées de l’autorité du dépôt.",
          )

      - name: Verify documentation and package
        run: |
          npm ci
          node scripts/test-governed-note-doc-contract.mjs
          npm run test:docs
          npm pack --dry-run

      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/fix-release-docs-once.yml
          git config user.name "optimikelabs-release"
          git config user.email "31423109+optimikelabs@users.noreply.github.com"
          git add docs/governed-note-replacement.md docs/governed-note-replacement.fr.md .github/workflows/fix-release-docs-once.yml
          git commit -m "docs: finalize governed note replacement for v2.6.0"
          git push origin HEAD:release/2.6.0
