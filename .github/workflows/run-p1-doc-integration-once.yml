name: Run P1 docs integration once

on:
  push:
    branches: [feat/governed-frontmatter-p1]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: run-p1-doc-integration-once
  cancel-in-progress: false

jobs:
  integrate:
    if: github.actor == 'optimikelabs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/governed-frontmatter-p1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix plugins/obsidian-bases-bridge ci
          npm --prefix plugins/obsidian-operon-bridge ci
          npm --prefix plugins/obsidian-atomic-write-bridge ci

      - name: Integrate and format P1 documentation
        run: |
          python scripts/integrate-p1-docs.py
          npx prettier --write \
            package.json CHANGELOG.md README.md README.fr.md \
            OPERATIONS.md OPERATIONS.fr.md SECURITY.md SECURITY.fr.md \
            docs/README.md docs/README.fr.md \
            docs/obsidian_mcp_tools_spec.md \
            docs/runtime-capability-matrix.md \
            docs/runtime-capability-matrix.fr.md \
            scripts/test-tool-annotations.mjs \
            scripts/test-package-contents.mjs

      - name: Verify production, contracts, docs, and package
        run: |
          node scripts/test-governed-frontmatter-model.mjs
          npm run build
          node scripts/test-frontmatter-p1-compiler.mjs
          node scripts/test-governed-frontmatter-mcp.mjs
          node scripts/test-governed-frontmatter-http.mjs
          npm run test:docs
          node scripts/test-tool-annotations.mjs
          node scripts/test-governed-frontmatter-doc-contract.mjs
          npm run build:bridges
          npm run test:package
          npm run audit:production

      - name: Commit only non-workflow integration changes
        run: |
          rm scripts/integrate-p1-docs.py
          git config user.name "optimikelabs-p1"
          git config user.email "31423109+optimikelabs@users.noreply.github.com"
          git add package.json CHANGELOG.md README.md README.fr.md \
            OPERATIONS.md OPERATIONS.fr.md SECURITY.md SECURITY.fr.md \
            docs scripts
          git commit -m "docs(p1): integrate governed frontmatter contract"
          git push origin HEAD:feat/governed-frontmatter-p1
