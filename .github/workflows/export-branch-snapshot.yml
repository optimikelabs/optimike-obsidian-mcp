name: Apply reviewed 2.6 RC patch

on:
  push:
    branches:
      - feat/2.6.0-governed-note-replace

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/2.6.0-governed-note-replace
          fetch-depth: 3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Reconstruct and verify reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          BASE=c2b2fd136aca3bfd17ed11fd9464201b653ecc63
          test "$(git diff --name-only "$BASE"..HEAD)" = ".github/workflows/export-branch-snapshot.yml"
          git fetch origin tmp/2.6-rc-patch:refs/remotes/origin/tmp/2.6-rc-patch
          rm -rf /tmp/optimike-rc-payload
          mkdir -p /tmp/optimike-rc-payload
          git archive origin/tmp/2.6-rc-patch rc-binary | tar -x -C /tmp/optimike-rc-payload
          python - <<'PY'
          from pathlib import Path
          import gzip
          import hashlib

          files = sorted(Path('/tmp/optimike-rc-payload/rc-binary').glob('*.bin'))
          assert len(files) == 26, f'expected 26 payload chunks, got {len(files)}'
          payload = bytearray()
          for file in files:
              data = file.read_bytes()
              if data.startswith(b'OPTIMIKE_RC_PATCH_CHUNK_'):
                  data = data.split(b'\n', 1)[1]
              payload.extend(data)

          compressed = bytes(payload)
          assert len(compressed) == 22639, len(compressed)
          assert hashlib.sha256(compressed).hexdigest() == 'e90feaba23792324ed1fca6fd2cc30961bd99a9f8bdf762f81956c1d00eb09df'
          patch = gzip.decompress(compressed)
          assert len(patch) == 82268, len(patch)
          assert hashlib.sha256(patch).hexdigest() == '40be189041ba7fcf241adf08a84f5b4ebd1fd4217070fc5f3b775d3ed4df1f9a'
          Path('/tmp/optimike-2.6-completion.patch').write_bytes(patch)
          PY
          git show "$BASE":.github/workflows/export-branch-snapshot.yml > .github/workflows/export-branch-snapshot.yml
          git apply --check /tmp/optimike-2.6-completion.patch
          git apply /tmp/optimike-2.6-completion.patch
          git diff --check
      - name: Install dependencies
        run: npm ci
      - name: Build candidate
        run: npm run build
      - name: Test public stdio surface
        run: node scripts/test-governed-note-replace-mcp.mjs
      - name: Test process-shared HTTP surface
        run: node scripts/test-governed-note-replace-http.mjs
      - name: Test governed documentation contract
        run: node scripts/test-governed-note-doc-contract.mjs
      - name: Test annotations
        run: npm run test:tool-annotations
      - name: Test documentation
        run: npm run test:docs
      - name: Test package contents
        run: npm run test:package
      - name: Commit reviewed RC completion
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/export-branch-snapshot.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(mcp): complete governed atomic note replacement RC"
          git push origin HEAD:feat/2.6.0-governed-note-replace
          git push origin --delete tmp/2.6-rc-patch || true
