name: Export branch snapshot

on:
  push:
    branches:
      - feat/2.6.0-governed-note-replace

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: governed-note-replace-branch-snapshot
          path: |
            .
            !.git/**
            !node_modules/**
            !plugins/**/node_modules/**
            !.tmp/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
