name: Temporary tracked source export
on:
  pull_request:
    paths: ['.github/workflows/export-cycle-source.yml']
permissions:
  contents: read
jobs:
  source:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Export tracked source without credentials or runtime data
        run: |
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/cycle-source.tgz"
          git rev-parse HEAD > "$RUNNER_TEMP/source-sha.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/source-tree.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: cycle-source
          path: |
            ${{ runner.temp }}/cycle-source.tgz
            ${{ runner.temp }}/source-sha.txt
            ${{ runner.temp }}/source-tree.txt
          retention-days: 1
          if-no-files-found: error
