name: Apply sealed M3 checkpoint
on:
  pull_request:
    paths: ['.github/workflows/apply-m3-checkpoint.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'optimikelabs/optimike-obsidian-mcp' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/m3-native-note-move'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const crypto = require('node:crypto');
            const repo = context.repo;
            const branch = 'feat/m3-native-note-move';
            const head = context.payload.pull_request.head.sha;
            const recipePath = 'docs/cycle-20260920/m3-integration-edits.json';
            const workflowPath = '.github/workflows/apply-m3-checkpoint.yml';
            const allowed = new Set([
              'src/services/obsidianRestAPI/service.ts',
              'src/mcp-server/tools/governedNoteReplaceTools/runtime.ts',
              'src/mcp-server/tools/runtimeTools/registration.ts',
              'src/services/operations/obsidianNoteReplaceJournal.ts',
              'src/services/operationCockpit.ts',
              'plugins/obsidian-atomic-write-bridge/src/main.ts',
              'plugins/obsidian-atomic-write-bridge/manifest.json',
              'plugins/obsidian-atomic-write-bridge/package.json',
              'plugins/obsidian-atomic-write-bridge/package-lock.json',
              'plugins/obsidian-atomic-write-bridge/esbuild.config.mjs',
              'src/mcp-server/tools/nativeNoteMoveTools/index.ts',
            ]);
            const hash = text => {
              const b = Buffer.from(text, 'utf8');
              return crypto.createHash('sha1').update(`blob ${b.length}\0`).update(b).digest('hex');
            };
            async function currentHead() {
              return (await github.rest.git.getRef({...repo, ref: 'heads/' + branch})).data.object.sha;
            }
            async function read(p) {
              const {data} = await github.rest.repos.getContent({...repo, path: p, ref: head});
              if (Array.isArray(data) || data.type !== 'file' || data.encoding !== 'base64' || data.size > 300000) throw new Error('Unsupported input');
              const bytes = Buffer.from(data.content, 'base64');
              const text = bytes.toString('utf8');
              if (!bytes.equals(Buffer.from(text, 'utf8')) || hash(text) !== data.sha) throw new Error('Input integrity failure');
              return {text, sha:data.sha};
            }
            if (await currentHead() !== head) throw new Error('Concurrent branch update; refusing');
            const r = JSON.parse((await read(recipePath)).text);
            if (r.version !== 1 || r.branch !== branch || r.expectedBaseCommit !== '254b87fa1b31e35163579f069de7338303ea34c8' ||
                r.message !== 'feat(m3): wire native move to shared runtime, Bridge gates and operation cockpit' ||
                !Array.isArray(r.files) || r.files.length !== allowed.size) throw new Error('Unexpected checkpoint contract');
            const comparison = (await github.rest.repos.compareCommitsWithBasehead({...repo, basehead:r.expectedBaseCommit+'...'+head})).data;
            if (comparison.status !== 'ahead' || comparison.files.some(f => ![recipePath,workflowPath].includes(f.filename))) throw new Error('Product changed since checkpoint');
            const entries = [];
            const seen = new Set();
            for (const f of r.files) {
              if (!allowed.has(f.path) || seen.has(f.path) || !/^[a-f0-9]{40}$/.test(f.beforeSha) || !/^[a-f0-9]{40}$/.test(f.afterSha) ||
                  !Array.isArray(f.replacements) || f.replacements.length > 16) throw new Error('Unexpected edit');
              seen.add(f.path);
              const old = await read(f.path);
              if (old.sha !== f.beforeSha) throw new Error('Stale checkpoint file: '+f.path);
              let text = old.text;
              for (const patch of f.replacements) {
                const n = patch.count ?? 1;
                if (typeof patch.before !== 'string' || !patch.before || typeof patch.after !== 'string' ||
                    !Number.isInteger(n) || n < 1 || n > 10) throw new Error('Invalid literal patch');
                const parts = text.split(patch.before);
                if (parts.length !== n+1) throw new Error('Ambiguous checkpoint anchor: '+f.path);
                text = parts.join(patch.after);
              }
              if (Buffer.byteLength(text,'utf8') > 300000 || hash(text) !== f.afterSha) throw new Error('Output integrity failure: '+f.path);
              entries.push({path:f.path, mode:'100644', type:'blob', content:text});
            }
            entries.push({path:recipePath, mode:'100644', type:'blob', sha:null});
            entries.push({path:workflowPath, mode:'100644', type:'blob', sha:null});
            const commit = (await github.rest.git.getCommit({...repo, commit_sha:head})).data;
            const tree = (await github.rest.git.createTree({...repo, base_tree:commit.tree.sha, tree:entries})).data;
            const next = (await github.rest.git.createCommit({...repo, message:r.message, tree:tree.sha, parents:[head]})).data;
            if (await currentHead() !== head) throw new Error('Concurrent branch update; no ref changed');
            await github.rest.git.updateRef({...repo, ref:'heads/'+branch, sha:next.sha, force:false});
            if (await currentHead() !== next.sha) throw new Error('Remote verification failed');
            core.notice('Durable M3 integration checkpoint: '+next.sha);
