name: MCP 2026 isolated qualification

on:
  push:
    branches: [codex/mcp-2026-dual-stack-4e59b8ec]
    paths: [.github/workflows/mcp-2026-qualification.yml]
  pull_request:
    paths: [.github/workflows/mcp-2026-qualification.yml]

permissions:
  contents: read

jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Record immutable inputs and export tracked source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mcp-evidence /tmp/mcp-v2-sdk
          git rev-parse HEAD > /tmp/mcp-evidence/source-sha.txt
          git status --porcelain > /tmp/mcp-evidence/worktree-before.txt
          git archive --format=tar HEAD | gzip > /tmp/mcp-evidence/source.tar.gz
          node --version > /tmp/mcp-evidence/node-version.txt
          npm --version > /tmp/mcp-evidence/npm-version.txt
      - name: Install and qualify unchanged P0 baseline
        shell: bash
        run: |
          set -euo pipefail
          npm ci 2>&1 | tee /tmp/mcp-evidence/npm-ci.log
          npm run test:vnext-reliability 2>&1 | tee /tmp/mcp-evidence/p0-tests.log
          node scripts/benchmark-vnext-e2e.mjs /tmp/mcp-evidence/p0-benchmark.json 2>&1 | tee /tmp/mcp-evidence/p0-benchmark.log
      - name: Resolve official SDK in an isolated directory
        shell: bash
        run: |
          set -euo pipefail
          for pkg in server client core codemod; do
            npm view "@modelcontextprotocol/$pkg" version dist-tags --json --registry=https://registry.npmjs.org/ > "/tmp/mcp-evidence/npm-$pkg.json"
          done
          cd /tmp/mcp-v2-sdk
          printf '%s\n' '{"name":"optimike-mcp-sdk-qualification","private":true,"type":"module"}' > package.json
          for pkg in server client core codemod; do
            version=$(npm view "@modelcontextprotocol/$pkg" version --registry=https://registry.npmjs.org/)
            npm install --save-exact --ignore-scripts --registry=https://registry.npmjs.org/ "@modelcontextprotocol/$pkg@$version"
          done
          cp package.json /tmp/mcp-evidence/sdk-package.json
          cp package-lock.json /tmp/mcp-evidence/sdk-package-lock.json
      - name: Export reproducible offline workspace without credentials
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -d node_modules ]; then
            tar -czf /tmp/mcp-evidence/baseline-dependencies.tar.gz node_modules
          fi
          if [ -f /tmp/mcp-v2-sdk/package.json ]; then
            tar -czf /tmp/mcp-evidence/sdk-workspace.tar.gz -C /tmp/mcp-v2-sdk .
          fi
          cd /tmp/mcp-evidence
          sha256sum *.tar.gz > archive-sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcp-2026-qualification-workspace
          path: /tmp/mcp-evidence/
          retention-days: 1
          if-no-files-found: error
