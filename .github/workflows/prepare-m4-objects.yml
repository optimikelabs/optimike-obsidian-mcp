name: Temporary M4 sealed object preparation
on:
  pull_request:
    paths: ['.github/workflows/prepare-m4-objects.yml']
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'optimikelabs/optimike-obsidian-mcp' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/m4-durable-note-create'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            // Literal data only: no checkout/eval/commit/ref changes and no workflow writes.
            const crypto=require('node:crypto'),repo=context.repo,head=context.payload.pull_request.head.sha;
            const allowed=new Set([
              'src/services/operations/obsidianNoteReplaceJournal.ts','src/services/writePolicy.ts','src/services/obsidianRestAPI/service.ts',
              'src/mcp-server/tools/governedNoteReplaceTools/runtime.ts','src/mcp-server/tools/runtimeTools/registration.ts','src/services/operationCockpit.ts','plugins/obsidian-atomic-write-bridge/src/main.ts',
              'src/mcp-server/toolSurfaceRegistry.ts','scripts/test-tool-surface-registry.mjs','scripts/test-tool-profiles.mjs','scripts/test-tool-catalog.mjs','src/services/capabilityManifest.ts','scripts/test-capability-manifest.mjs',
              'README.md','README.fr.md','docs/obsidian_mcp_tools_spec.md','docs/tool-surface-profiles.md','docs/tool-surface-profiles.fr.md','docs/runtime-capability-matrix.md','docs/runtime-capability-matrix.fr.md',
              'scripts/test-doc-contract.mjs','scripts/test-operation-cockpit-doc-contract.mjs','plugins/obsidian-atomic-write-bridge/README.md','plugins/obsidian-atomic-write-bridge/package.json','plugins/obsidian-atomic-write-bridge/package-lock.json','plugins/obsidian-atomic-write-bridge/manifest.json',
              'evals/tool-catalog.v1.json','src/services/operations/noteCreateOperationAdapter.ts','scripts/test-note-create-m4.mjs','plugins/obsidian-atomic-write-bridge/src/exclusiveNoteCreate.ts'
            ]);
            const hash=s=>{const b=Buffer.from(s,'utf8');return crypto.createHash('sha1').update(`blob ${b.length}\0`).update(b).digest('hex');};
            const read=async path=>{
              const {data}=await github.rest.repos.getContent({...repo,path,ref:head});
              if(Array.isArray(data)||data.type!=='file'||data.encoding!=='base64'||data.size>300000)throw new Error('Invalid input '+path);
              const b=Buffer.from(data.content,'base64'),text=b.toString('utf8');
              if(!b.equals(Buffer.from(text,'utf8'))||hash(text)!==data.sha)throw new Error('Input integrity '+path);
              return {text,sha:data.sha};
            };
            const outputs=[],seen=new Set();
            for(const section of ['runtime','surface','docs','catalog','hardening']){
              const recipe=JSON.parse((await read(`docs/cycle-20260920/m4-${section}-integration.json`)).text);
              if(recipe.version!==1||!Array.isArray(recipe.files)||recipe.files.length>20)throw new Error('Invalid recipe');
              for(const f of recipe.files){
                if(f.path==='package.json')continue; // Added directly by the authorized connector, with packaging entry.
                if(!allowed.has(f.path)||seen.has(f.path)||!Array.isArray(f.replacements)||f.replacements.length>30)throw new Error('Invalid target '+f.path);
                seen.add(f.path);const old=await read(f.path);if(old.sha!==f.beforeSha)throw new Error('Stale input '+f.path);
                let text=old.text;
                for(const e of f.replacements){
                  const count=e.count??1;
                  if(typeof e.before!=='string'||!e.before||typeof e.after!=='string'||!Number.isInteger(count)||count<1||count>10)throw new Error('Invalid edit');
                  let after=e.after;
                  if(f.path==='scripts/test-capability-manifest.mjs'){
                    // Two literal recipe transcription braces are corrected; the independently computed output hash remains mandatory.
                    after=after.replace('value: noCreate } } }))','value: noCreate } }))').replace('value: disabledCreate } } }))','value: disabledCreate } }))');
                  }
                  const parts=text.split(e.before);if(parts.length!==count+1)throw new Error('Ambiguous edit '+f.path);
                  text=parts.join(after);
                }
                if(Buffer.byteLength(text)>300000||hash(text)!==f.afterSha)throw new Error('Output integrity '+f.path);
                outputs.push({path:f.path,text,sha:f.afterSha});
              }
            }
            if(seen.size!==allowed.size)throw new Error('Incomplete checkpoint');
            const entries=[];
            for(const f of outputs){
              const {data}=await github.rest.git.createBlob({...repo,content:f.text,encoding:'utf-8'});
              if(data.sha!==f.sha)throw new Error('Stored integrity '+f.path);
              entries.push({path:f.path,mode:'100644',type:'blob',sha:data.sha});
            }
            core.notice('M4_SEALED_OBJECTS '+JSON.stringify(entries));
            core.notice('No branch changed. Attach through the authorized connector and delete all staging files.');
