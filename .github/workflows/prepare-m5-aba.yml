name: Temporary M5 query-proof preparation
on:
  pull_request:
    paths: ['.github/workflows/prepare-m5-aba.yml']
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'optimikelabs/optimike-obsidian-mcp' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/m5-p7-base-rows'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm --prefix plugins/obsidian-bases-bridge ci
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const fs=require('node:fs'),crypto=require('node:crypto');
            const allowed=new Set(['plugins/obsidian-bases-bridge/src/main.ts','plugins/obsidian-bases-bridge/package.json','plugins/obsidian-bases-bridge/package-lock.json','plugins/obsidian-bases-bridge/manifest.json','src/services/baseRowSelection.ts','scripts/test-base-rows-selection-m5.mjs','scripts/test-base-rows-patch-m5.mjs','docs/base-row-patch-m5.md']);
            const hash=s=>{const b=Buffer.from(s);return crypto.createHash('sha1').update(`blob ${b.length}\0`).update(b).digest('hex');};
            const recipe=JSON.parse(fs.readFileSync('docs/cycle-20260920/m5-aba-integration.json','utf8')),seen=new Set();
            if(recipe.version!==1||recipe.files.length!==allowed.size)throw new Error('Invalid recipe');
            for(const f of recipe.files){
              if(!allowed.has(f.path)||seen.has(f.path))throw new Error('Invalid target');seen.add(f.path);
              let text=fs.readFileSync(f.path,'utf8');if(hash(text)!==f.beforeSha)throw new Error('Stale input '+f.path);
              for(const e of f.replacements){const parts=text.split(e.before);if(!e.before||parts.length!==e.count+1)throw new Error('Ambiguous input');text=parts.join(e.after);}
              if(hash(text)!==f.afterSha)throw new Error('Output mismatch '+f.path);fs.writeFileSync(f.path,text);
            }
      - run: npm run test:base-rows
      - run: npm --prefix plugins/obsidian-bases-bridge run check
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const fs=require('node:fs');
            const recipe=JSON.parse(fs.readFileSync('docs/cycle-20260920/m5-aba-integration.json','utf8')),entries=[];
            for(const f of recipe.files){const text=fs.readFileSync(f.path,'utf8');const {data}=await github.rest.git.createBlob({...context.repo,content:text,encoding:'utf-8'});if(data.sha!==f.afterSha)throw new Error('Blob mismatch');entries.push({path:f.path,mode:'100644',type:'blob',sha:data.sha});}
            core.notice('M5_ABA_OBJECTS '+JSON.stringify(entries));
            core.notice('No branch mutation; attach objects via the connector and remove preparation files.');
