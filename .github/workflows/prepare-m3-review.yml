name: Temporary M3 review object preparation
on:
  pull_request:
    paths: ['.github/workflows/prepare-m3-review.yml']
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'optimikelabs/optimike-obsidian-mcp' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/m3-native-note-move'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const crypto=require('node:crypto');
            const repo=context.repo,head=context.payload.pull_request.head.sha;
            const allowed=new Set(['src/services/operations/nativeNoteMoveOperationAdapter.ts','plugins/obsidian-atomic-write-bridge/src/nativeNoteMove.ts','scripts/test-native-note-move-m3.mjs','plugins/obsidian-atomic-write-bridge/src/nativeNoteMove.test.ts']);
            const hash=s=>{const b=Buffer.from(s,'utf8');return crypto.createHash('sha1').update(`blob ${b.length}\0`).update(b).digest('hex');};
            const read=async path=>{
              const {data}=await github.rest.repos.getContent({...repo,path,ref:head});
              if(Array.isArray(data)||data.type!=='file'||data.encoding!=='base64'||data.size>100000)throw new Error('Invalid input');
              const b=Buffer.from(data.content,'base64'),text=b.toString('utf8');
              if(!b.equals(Buffer.from(text,'utf8'))||hash(text)!==data.sha)throw new Error('Input integrity');
              return {text,sha:data.sha};
            };
            const recipe=JSON.parse((await read('docs/cycle-20260920/m3-review-fixes.json')).text);
            if(recipe.version!==1||recipe.files.length!==allowed.size)throw new Error('Invalid recipe');
            const seen=new Set(),outputs=[];
            for(const f of recipe.files){
              if(!allowed.has(f.path)||seen.has(f.path)||!Array.isArray(f.replacements)||f.replacements.length>20)throw new Error('Invalid target');
              seen.add(f.path);const old=await read(f.path);if(old.sha!==f.beforeSha)throw new Error('Stale target');
              let text=old.text;
              for(const e of f.replacements){
                if(typeof e.before!=='string'||!e.before||typeof e.after!=='string'||text.split(e.before).length!==2)throw new Error('Ambiguous edit');
                text=text.replace(e.before,()=>e.after);
              }
              if(Buffer.byteLength(text)>100000||hash(text)!==f.afterSha)throw new Error('Output integrity');
              outputs.push({path:f.path,text,sha:f.afterSha});
            }
            const entries=[];
            for(const f of outputs){
              const {data}=await github.rest.git.createBlob({...repo,content:f.text,encoding:'utf-8'});
              if(data.sha!==f.sha)throw new Error('Stored integrity');
              entries.push({path:f.path,mode:'100644',type:'blob',sha:data.sha});
            }
            core.notice('M3_REVIEW_BLOBS '+JSON.stringify(entries));
            // No branch/ref/commit/workflow mutation; the connector attaches objects and removes staging.
