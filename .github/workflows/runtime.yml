name: Runtime

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # LICENSE and NOTICE are read by no test. A change limited to them still
  # reports the required `runtime` checks (the job runs and its steps are
  # skipped), because a required check that never starts blocks the merge.
  # Any other path, an unknown base, a failed diff or a failed `changes` job
  # runs everything. Renames are listed under both names.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: diff
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          code=true
          files=""
          if [[ -n "$BASE" && ! "$BASE" =~ ^0+$ ]] && mb=$(git merge-base "$BASE" "$HEAD" 2>/dev/null); then
            files=$(git diff --no-renames --name-only "$mb" "$HEAD")
            if [[ -n "$files" ]] && ! grep -qvxE 'LICENSE|NOTICE' <<<"$files"; then
              code=false
            fi
          fi
          printf 'Changed files:\n%s\n' "${files:-<unknown>}"
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  runtime:
    needs: changes
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      RUN_SUITE: ${{ needs.changes.result != 'success' || needs.changes.outputs.code == 'true' }}
    steps:
      - if: env.RUN_SUITE != 'true'
        run: echo "Only LICENSE or NOTICE changed; runtime suite skipped."
      - if: env.RUN_SUITE == 'true'
        uses: actions/checkout@v4

        with:

          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - if: env.RUN_SUITE == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - if: env.RUN_SUITE == 'true'
        run: npm ci
      - if: env.RUN_SUITE == 'true'
        run: npm run test:log-privacy
      - if: env.RUN_SUITE == 'true'
        run: npm run test:audit-suite
      - if: env.RUN_SUITE == 'true'
        run: npm run test:backend-supervisor
      - if: env.RUN_SUITE == 'true'
        run: node scripts/test-governed-frontmatter-model.mjs
      - if: env.RUN_SUITE == 'true'
        run: npm run test:runtime
      - if: env.RUN_SUITE == 'true'
        run: npm run test:semantic-index-producer
      - if: env.RUN_SUITE == 'true'
        run: npm run test:external-roots
      - if: env.RUN_SUITE == 'true'
        run: npm run test:operation-runtime
      - if: env.RUN_SUITE == 'true'
        run: npm run test:governed-performance
      - if: env.RUN_SUITE == 'true'
        run: npm run test:note-links
      - if: env.RUN_SUITE == 'true'
        run: npm run test:format-validation
      - if: env.RUN_SUITE == 'true'
        run: npm run test:native-note-move
      - if: env.RUN_SUITE == 'true'
        run: node scripts/test-governed-canvas-mcp.mjs
      - if: env.RUN_SUITE == 'true'
        run: node scripts/test-governed-canvas-http.mjs
      - if: env.RUN_SUITE == 'true'
        run: node scripts/test-governed-note-replace-mcp.mjs
      - if: env.RUN_SUITE == 'true'
        run: node scripts/test-governed-note-replace-http.mjs
      - if: env.RUN_SUITE == 'true'
        run: npm run test:profiles
      - if: env.RUN_SUITE == 'true'
        run: npm run test:tool-annotations
      # The hermetic scorer owns its single authoritative rebuild in the P6
      # workflow. Runtime keeps the cross-platform behavioral contracts only.
      - if: env.RUN_SUITE == 'true'
        run: npm run test:tool-routing:fast
      - if: env.RUN_SUITE == 'true'
        run: npm run test:docs
      - if: env.RUN_SUITE == 'true'
        run: node scripts/test-governed-note-doc-contract.mjs
      - if: env.RUN_SUITE == 'true'
        run: npm run test:launchers
      - if: env.RUN_SUITE == 'true' && runner.os == 'Windows'
        run: npm run test:migrations:windows

  bridge-privacy:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

        with:

          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install Bases Bridge dependencies
        working-directory: plugins/obsidian-bases-bridge
        run: npm ci
      - name: Install Operon Bridge dependencies
        working-directory: plugins/obsidian-operon-bridge
        run: npm ci
      - name: Install Atomic Write Bridge dependencies
        working-directory: plugins/obsidian-atomic-write-bridge
        run: npm ci
      - name: Test Bases Bridge privacy boundary
        run: npm --prefix plugins/obsidian-bases-bridge run check
      - name: Test Operon Bridge privacy boundary
        run: npm --prefix plugins/obsidian-operon-bridge run check
      - name: Test Atomic Write Bridge privacy boundary
        run: npm --prefix plugins/obsidian-atomic-write-bridge run check

  http-external-handoff:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

        with:

          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --silent
      - run: npm run test:http-external-handoff

  http-multiclient:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

        with:

          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --silent
      - run: npm run test:http-multiclient

  http-backpressure:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

        with:

          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --silent
      - run: npm run test:http-backpressure

  stdio-proxy-reliability:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

        with:

          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --silent
      - run: npm run test:stdio-proxy-reliability

  http-observability:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

        with:

          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --silent
      - run: npm run test:http-observability

  http-headless-multiclient:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

        with:

          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --silent
      - run: npm run test:http-headless-multiclient

  packaging:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

        with:

          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm run audit:production
      - name: Install Bases Bridge dependencies
        working-directory: plugins/obsidian-bases-bridge
        run: npm ci
      - name: Install Operon Bridge dependencies
        working-directory: plugins/obsidian-operon-bridge
        run: npm ci
      - name: Install Atomic Write Bridge dependencies
        working-directory: plugins/obsidian-atomic-write-bridge
        run: npm ci
      - name: Test Bases Bridge
        run: npm run check:bases-bridge
      - name: Test Operon Bridge privacy boundary
        run: npm --prefix plugins/obsidian-operon-bridge run check
      - name: Test Atomic Write runtime and Bridge
        run: npm run check:atomic-write
      - name: Build MCP server
        run: npm run build
      - name: Build installable Bridges
        run: npm run build:bridges
      - name: Verify npm package contents
        run: npm run test:package
      - name: Upload Bases Bridge artifact
        uses: actions/upload-artifact@v4
        with:
          name: obsidian-bases-bridge
          path: |
            plugins/obsidian-bases-bridge/build/main.js
            plugins/obsidian-bases-bridge/build/manifest.json
          if-no-files-found: error
      - name: Upload Atomic Write Bridge artifact
        uses: actions/upload-artifact@v4
        with:
          name: optimike-atomic-write-bridge
          path: |
            plugins/obsidian-atomic-write-bridge/build/main.js
            plugins/obsidian-atomic-write-bridge/build/manifest.json
          if-no-files-found: error
