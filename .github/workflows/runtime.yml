name: Runtime

on:
  push:
    branches: [main]
  pull_request:

jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run test:runtime
      - run: npm run test:external-roots
      - run: npm run test:operation-runtime
      - run: npm run test:profiles
      - run: npm run test:tool-annotations
      - run: npm run test:docs
      - run: npm run test:launchers
      - if: runner.os == 'Windows'
        run: npm run test:migrations:windows

  http-external-handoff:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --silent
      - run: npm run test:http-external-handoff

  http-multiclient:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --silent
      - run: npm run test:http-multiclient

  http-backpressure:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --silent
      - run: npm run test:http-backpressure

  http-observability:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --silent
      - run: npm run test:http-observability

  http-headless-multiclient:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --silent
      - run: npm run test:http-headless-multiclient

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm run audit:production
      - name: Install Bases Bridge dependencies
        working-directory: plugins/obsidian-bases-bridge
        run: npm ci
      - name: Install Operon Bridge dependencies
        working-directory: plugins/obsidian-operon-bridge
        run: npm ci
      - name: Install Atomic Write Bridge dependencies
        working-directory: plugins/obsidian-atomic-write-bridge
        run: npm ci
      - name: Test Bases Bridge
        run: npm run check:bases-bridge
      - name: Test Atomic Write runtime and Bridge
        run: npm run check:atomic-write
      - name: Build MCP server
        run: npm run build
      - name: Build installable Bridges
        run: npm run build:bridges
      - name: Verify npm package contents
        run: npm run test:package
      - name: Upload Bases Bridge artifact
        uses: actions/upload-artifact@v4
        with:
          name: obsidian-bases-bridge
          path: |
            plugins/obsidian-bases-bridge/build/main.js
            plugins/obsidian-bases-bridge/build/manifest.json
          if-no-files-found: error
      - name: Upload Atomic Write Bridge artifact
        uses: actions/upload-artifact@v4
        with:
          name: optimike-atomic-write-bridge
          path: |
            plugins/obsidian-atomic-write-bridge/build/main.js
            plugins/obsidian-atomic-write-bridge/build/manifest.json
          if-no-files-found: error
