name: M5 Governed Base Row Patch
on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package*.json'
      - 'docs/base-row-patch-m5.md'
      - '.github/workflows/base-rows-patch.yml'
permissions:
  contents: read
jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run test:base-rows
      - run: npm run test:profiles
      - run: node scripts/test-tool-catalog.mjs
      - run: node scripts/test-capability-manifest.mjs
      - run: npm run test:docs
