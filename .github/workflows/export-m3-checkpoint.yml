name: Temporary M3 read-only source export
on:
  pull_request:
    paths: ['.github/workflows/export-m3-checkpoint.yml']
permissions:
  contents: read
jobs:
  export:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/m3-native-note-move'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Archive tracked source only
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/m3-source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/m3-source-sha.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/m3-source-tree.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: m3-source-checkpoint
          path: |
            ${{ runner.temp }}/m3-source.tar.gz
            ${{ runner.temp }}/m3-source-sha.txt
            ${{ runner.temp }}/m3-source-tree.txt
          retention-days: 1
          if-no-files-found: error
