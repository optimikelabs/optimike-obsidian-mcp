name: Temporary M5 sealed object preparation
on:
  pull_request:
    paths: ['.github/workflows/prepare-m5-objects.yml']
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'optimikelabs/optimike-obsidian-mcp' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/m5-p7-base-rows'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const fs=require('node:fs'),crypto=require('node:crypto');
            const allowed=new Set([
              'src/mcp-server/toolSurfaceRegistry.ts','src/mcp-server/tools/runtimeTools/registration.ts',
              'src/services/operations/obsidianNoteReplaceJournal.ts','src/mcp-server/tools/governedNoteReplaceTools/runtime.ts',
              'src/services/operationCockpit.ts','scripts/test-tool-surface-registry.mjs','scripts/test-tool-profiles.mjs',
              'scripts/test-tool-catalog.mjs','src/services/capabilityManifest.ts','scripts/test-capability-manifest.mjs',
              'README.md','README.fr.md','docs/tool-surface-profiles.md','docs/tool-surface-profiles.fr.md',
              'docs/obsidian_mcp_tools_spec.md','scripts/test-doc-contract.mjs','scripts/test-operation-cockpit-doc-contract.mjs','package.json'
            ]);
            const hash=text=>{const b=Buffer.from(text,'utf8');return crypto.createHash('sha1').update(`blob ${b.length}\0`).update(b).digest('hex');};
            const seen=new Set(),outputs=[];
            for(const n of [1,2,3]){
              const recipe=JSON.parse(fs.readFileSync(`docs/cycle-20260920/m5-part${n}.json`,'utf8'));
              if(recipe.version!==1||!Array.isArray(recipe.files)||recipe.files.length!==6)throw new Error('Invalid recipe');
              for(const f of recipe.files){
                if(!allowed.has(f.path)||seen.has(f.path)||!Array.isArray(f.replacements)||f.replacements.length>20)throw new Error('Invalid target');
                seen.add(f.path);
                let text=fs.readFileSync(f.path,'utf8');if(hash(text)!==f.beforeSha)throw new Error('Stale input '+f.path);
                for(const e of f.replacements){
                  if(typeof e.before!=='string'||!e.before||typeof e.after!=='string'||!Number.isInteger(e.count)||e.count<1||e.count>10)throw new Error('Invalid literal edit');
                  const parts=text.split(e.before);if(parts.length!==e.count+1)throw new Error('Ambiguous edit '+f.path);
                  text=parts.join(e.after);
                }
                if(Buffer.byteLength(text)>300000||hash(text)!==f.afterSha)throw new Error('Output mismatch '+f.path);
                fs.writeFileSync(f.path,text,'utf8');outputs.push({path:f.path,sha:f.afterSha});
              }
            }
            if(seen.size!==allowed.size)throw new Error('Incomplete integration');
            fs.writeFileSync(process.env.RUNNER_TEMP+'/m5-objects.json',JSON.stringify(outputs));
      - run: npm run build
      - run: node scripts/generate-tool-catalog.mjs
      - run: npm run test:base-rows
      - run: npm run test:profiles
      - run: node scripts/test-tool-catalog.mjs
      - run: node scripts/test-capability-manifest.mjs
      - run: npm run test:docs
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const fs=require('node:fs'),crypto=require('node:crypto');
            const hash=text=>{const b=Buffer.from(text,'utf8');return crypto.createHash('sha1').update(`blob ${b.length}\0`).update(b).digest('hex');};
            const files=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/m5-objects.json','utf8'));
            files.push({path:'evals/tool-catalog.v1.json',sha:'0f4097671c346d3ea2fb761f5d76ecacf41336c4'});
            const entries=[];
            for(const f of files){
              const text=fs.readFileSync(f.path,'utf8');if(hash(text)!==f.sha)throw new Error('Verified output changed '+f.path);
              const {data}=await github.rest.git.createBlob({...context.repo,content:text,encoding:'utf-8'});
              if(data.sha!==f.sha)throw new Error('Stored output mismatch');
              entries.push({path:f.path,mode:'100644',type:'blob',sha:data.sha});
            }
            core.notice('M5_SEALED_OBJECTS '+JSON.stringify(entries));
            core.notice('No branch changed. Attach via authorized connector; remove recipes and this workflow.');
