name: Temporary M3 sealed object preparation
on:
  pull_request:
    paths: ['.github/workflows/prepare-m3-objects.yml']
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'optimikelabs/optimike-obsidian-mcp' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/m3-native-note-move'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            // No source checkout, script evaluation, ref updates, commits, or workflow writes.
            // Only literal, hash-sealed product blobs are prepared for connector-side commits.
            const crypto = require('node:crypto');
            const repo = context.repo;
            const branch = 'feat/m3-native-note-move';
            const head = context.payload.pull_request.head.sha;
            const allowed = new Set([
              'src/mcp-server/toolSurfaceRegistry.ts','src/mcp-server/toolProfiles.ts',
              'scripts/test-tool-surface-registry.mjs','scripts/test-tool-profiles.mjs','scripts/test-tool-catalog.mjs',
              'package.json','evals/tool-catalog.v1.json',
              'README.md','README.fr.md','docs/tool-surface-profiles.md','docs/tool-surface-profiles.fr.md',
              'docs/obsidian_mcp_tools_spec.md','scripts/test-doc-contract.mjs','scripts/test-operation-cockpit-doc-contract.mjs',
              'docs/runtime-capability-matrix.md','docs/runtime-capability-matrix.fr.md',
              'src/services/capabilityManifest.ts','scripts/test-capability-manifest.mjs',
            ]);
            const hash = text => {
              const b = Buffer.from(text, 'utf8');
              return crypto.createHash('sha1').update(`blob ${b.length}\0`).update(b).digest('hex');
            };
            const current = async () => (await github.rest.git.getRef({...repo,ref:'heads/'+branch})).data.object.sha;
            if (await current() !== head) throw new Error('Concurrent update; no object preparation');
            const read = async path => {
              const {data} = await github.rest.repos.getContent({...repo,path,ref:head});
              if (Array.isArray(data) || data.type !== 'file' || data.encoding !== 'base64' || data.size > 300000) throw new Error('Unsupported input');
              const bytes = Buffer.from(data.content,'base64');
              const text = bytes.toString('utf8');
              if (!bytes.equals(Buffer.from(text,'utf8')) || hash(text) !== data.sha) throw new Error('Input hash mismatch');
              return {text,sha:data.sha};
            };
            const outputs=[]; const seen=new Set();
            for (const n of [1,2,3]) {
              const recipe=JSON.parse((await read(`docs/cycle-20260920/m3-surface-part${n}.json`)).text);
              if (recipe.version !== 1 || !Array.isArray(recipe.files) || recipe.files.length > 19) throw new Error('Invalid recipe');
              for (const file of recipe.files) {
                // Workflow files are deliberately excluded: the connector handles them directly.
                if (file.path === '.github/workflows/runtime.yml') continue;
                if (!allowed.has(file.path) || seen.has(file.path)) throw new Error('Unexpected target');
                seen.add(file.path);
                const old=await read(file.path);
                if (old.sha !== file.beforeSha || !Array.isArray(file.replacements) || file.replacements.length > 16) throw new Error('Stale or invalid recipe');
                let text=old.text;
                for (const edit of file.replacements) {
                  if (typeof edit.before !== 'string' || !edit.before || typeof edit.after !== 'string') throw new Error('Invalid edit');
                  const fix=s=>file.path==='docs/tool-surface-profiles.fr.md'?s.replace('Surface complète explicite du runtime actif','Surface complète/admin explicite du runtime actif'):s;
                  const before=fix(edit.before),after=fix(edit.after),count=edit.count??1;
                  if (!Number.isInteger(count) || count<1 || count>10) throw new Error('Invalid count');
                  const parts=text.split(before);
                  if (parts.length !== count+1) throw new Error('Ambiguous edit');
                  text=parts.join(after);
                }
                if (Buffer.byteLength(text,'utf8')>300000 || hash(text)!==file.afterSha) throw new Error('Output hash mismatch');
                outputs.push({path:file.path,content:text,sha:file.afterSha});
              }
            }
            if (seen.size!==allowed.size) throw new Error('Incomplete input');
            const entries=[];
            for (const file of outputs) {
              const {data}=await github.rest.git.createBlob({...repo,content:file.content,encoding:'utf-8'});
              if (data.sha!==file.sha) throw new Error('Stored blob hash mismatch');
              entries.push({path:file.path,mode:'100644',type:'blob',sha:data.sha});
            }
            core.notice('SEALED_M3_OBJECTS '+JSON.stringify(entries));
            core.notice('No branch or commit was changed. Attach these objects through the authorized connector and remove this workflow.');
