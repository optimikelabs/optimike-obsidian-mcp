name: VNext Reliability P0
on:
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "package*.json"
      - ".github/workflows/vnext-reliability.yml"
permissions:
  contents: read
jobs:
  reliability:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run test:vnext-reliability
      - run: node scripts/benchmark-vnext-e2e.mjs benchmark-vnext.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vnext-benchmark-${{ matrix.os }}
          path: benchmark-vnext.json
