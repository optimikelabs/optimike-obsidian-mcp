name: Operon Bridge

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "src/services/operon/**"
      - "src/mcp-server/tools/operonTools/**"
      - "src/mcp-server/tools/runtimeTools/registration.ts"
      - "src/mcp-server/toolSurfaceRegistry.ts"
      - "src/services/writePolicy.ts"
      - "plugins/obsidian-operon-bridge/**"
      - "scripts/test-operon-contract.mjs"
      - "scripts/test-operon-service.mjs"
      - "scripts/smoke-operon-35-live.mjs"
      - "scripts/smoke-operon-36-behaviors-live.mjs"
      - "scripts/test-operon-36-behavior-contract.mjs"
      - "docs/operon-*.md"
      - "docs/adr/ADR-Operon-Bridge.md"
      - "profiles/elysia-tasks/**"
      - "README.md"
      - "README.fr.md"
      - "CHANGELOG.md"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/operon-bridge.yml"

permissions:
  contents: read

jobs:
  mcp:
    name: MCP contract and service (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Operon Bridge dependencies for manifest attestation
        run: npm --prefix plugins/obsidian-operon-bridge ci
      - run: npm run test:runtime
      - run: npm run test:operon-contract
      - run: npm run test:operon-service
      - run: npm run test:operon-canary-path-safety
      - run: npm run test:operon-36-behavior-contract
      - run: npm run test:docs
      - run: npm pack --dry-run

  bridge:
    name: Bridge (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: plugins/obsidian-operon-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugins/obsidian-operon-bridge/package-lock.json
      - run: npm ci
      - run: npm run check
      - name: Upload installable Bridge artifact
        uses: actions/upload-artifact@v4
        with:
          name: optimike-operon-bridge-${{ matrix.os }}
          path: |
            plugins/obsidian-operon-bridge/build/main.js
            plugins/obsidian-operon-bridge/build/manifest.json
          if-no-files-found: error
