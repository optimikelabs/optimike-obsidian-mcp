name: P6 Tool Routing Evaluation

on:
  pull_request:
    paths:
      - ".github/workflows/p6-tool-routing-evaluation.yml"
      - "src/mcp-server/toolSurfaceRegistry.ts"
      - "src/mcp-server/toolProfiles.ts"
      - "evals/**"
      - "scripts/score-tool-routing-evals.mjs"
      - "scripts/generate-tool-catalog.mjs"
      - "scripts/measure-tool-profile-schemas.mjs"
      - "scripts/run-codex-routing-selection-eval.mjs"
      - "scripts/test-tool-catalog.mjs"
      - "scripts/test-tool-profile-schema-measurement.mjs"
      - "scripts/test-codex-routing-selection-eval.mjs"
      - "scripts/test-tool-routing-eval-corpus.mjs"
      - "scripts/test-tool-routing-scorer.mjs"
      - "scripts/test-tool-routing-evaluation-doc-contract.mjs"
      - "docs/tool-routing-evaluation-p6*.md"
      - "docs/tool-surface-profiles*.md"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-routing-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      # One Linux job owns the expensive clean-checkout rebuild. Windows still
      # exercises every routing contract without repeating npm ci/build for
      # each hostile scorer fixture.
      - if: runner.os == 'Linux'
        run: npm run test:tool-routing
      - if: runner.os == 'Windows'
        run: npm run test:tool-routing:fast
      - run: npm run test:profiles
      - run: node scripts/test-tool-routing-evaluation-doc-contract.mjs
      - name: Install Bases Bridge dependencies
        working-directory: plugins/obsidian-bases-bridge
        run: npm ci
      - name: Install Operon Bridge dependencies
        working-directory: plugins/obsidian-operon-bridge
        run: npm ci
      - name: Install Atomic Write Bridge dependencies
        working-directory: plugins/obsidian-atomic-write-bridge
        run: npm ci
      - run: npm run build:bridges
      - run: npm run test:package
