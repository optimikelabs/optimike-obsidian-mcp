name: Restore scoped 2.6 documentation

on:
  push:
    branches:
      - feat/2.6.0-governed-note-replace

permissions:
  contents: write

jobs:
  restore:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/2.6.0-governed-note-replace
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Restore 2.5 authorities and add only 2.6 deltas
        shell: bash
        run: |
          set -euo pipefail
          BASE=71bac26594fcba9c6fa6735ebd777b2e2820ad9f
          git checkout "$BASE" -- \
            README.md \
            README.fr.md \
            docs/README.md \
            docs/README.fr.md \
            docs/runtime-capability-matrix.fr.md \
            docs/adr/ADR-Common-Operation-Runtime.md
          python - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace_once(text, old, new, label):
              assert text.count(old) == 1, f'{label}: expected one anchor, got {text.count(old)}'
              return text.replace(old, new, 1)

          readme = read('README.md')
          readme = replace_once(
              readme,
              '## Quick start from source',
              '''## Governed atomic note replacement\n\nThe 2.6 release candidate exposes the existing atomic Markdown adapter through\nfour domain-specific tools: `obsidian_note_replace_plan`,\n`obsidian_note_replace_apply`, `obsidian_note_replace_status`, and\n`obsidian_note_replace_recover`. They are available only in `live`, or in\n`hybrid` while the Obsidian API and the default-off Atomic Write Bridge are\navailable. `planRef` is opaque; after a lost response, call `status` rather than\nsubmitting another mutation. `recover` reconciles or resumes the exact sealed\nplan and is not undo. See the\n[governed note replacement contract](docs/governed-note-replacement.md).\n\n## Quick start from source''',
              'README governed section',
          )
          readme = replace_once(
              readme,
              'opt-in SHA-256 compare-and-replace for the internal note-operation pilot;',
              'opt-in SHA-256 compare-and-replace backing governed whole-note replacement;',
              'README bridge description',
          )
          readme = replace_once(
              readme,
              'npm run test:runtime\nnpm run check:operon',
              'npm run test:runtime\nnpm run test:governed-note-replace-mcp\nnpm run test:governed-note-replace-http\nnpm run check:operon',
              'README verification',
          )
          readme = replace_once(
              readme,
              '- Current tools: [Tool Surface](docs/obsidian_mcp_tools_spec.md)',
              '- Current tools: [Tool Surface](docs/obsidian_mcp_tools_spec.md)\n- Governed atomic note replacement: [contract](docs/governed-note-replacement.md)',
              'README docs link',
          )
          write('README.md', readme)

          readme_fr = read('README.fr.md')
          readme_fr = replace_once(
              readme_fr,
              '## Démarrage rapide depuis les sources',
              '''## Remplacement atomique gouverné d’une note\n\nLe candidat 2.6 expose l’adaptateur Markdown atomique existant via quatre outils\nmétier : `obsidian_note_replace_plan`, `obsidian_note_replace_apply`,\n`obsidian_note_replace_status` et `obsidian_note_replace_recover`. Ils existent\nuniquement en `live`, ou en `hybrid` tant que l’API Obsidian et l’Atomic Write\nBridge — désactivé par défaut — sont disponibles. Le `planRef` est opaque ;\naprès une réponse perdue, appeler `status` plutôt que soumettre une nouvelle\nmutation. `recover` réconcilie ou reprend le plan exact scellé et n’est pas un\nundo. Voir le\n[contrat de remplacement gouverné](docs/governed-note-replacement.fr.md).\n\n## Démarrage rapide depuis les sources''',
              'README FR governed section',
          )
          readme_fr = replace_once(
              readme_fr,
              'compare-and-replace SHA-256 opt-in pour le pilote interne sur les notes ;',
              'compare-and-replace SHA-256 opt-in pour le remplacement gouverné de notes complètes ;',
              'README FR bridge description',
          )
          readme_fr = replace_once(
              readme_fr,
              'npm run test:runtime\nnpm run check:operon',
              'npm run test:runtime\nnpm run test:governed-note-replace-mcp\nnpm run test:governed-note-replace-http\nnpm run check:operon',
              'README FR validation',
          )
          readme_fr = replace_once(
              readme_fr,
              '- Outils actuels : [Surface des outils](docs/obsidian_mcp_tools_spec.md)',
              '- Outils actuels : [Surface des outils](docs/obsidian_mcp_tools_spec.md)\n- Remplacement atomique gouverné : [contrat](docs/governed-note-replacement.fr.md)',
              'README FR docs link',
          )
          write('README.fr.md', readme_fr)

          hub = read('docs/README.md')
          hub = replace_once(
              hub,
              '| Why does MCP expose Operon functions instead of calling the CLI? |',
              '| How does governed atomic note replacement work?             | [Governed Note Replacement](governed-note-replacement.md)                                 |\n| Why does MCP expose Operon functions instead of calling the CLI? |',
              'hub authority row',
          )
          hub = replace_once(
              hub,
              '- atomic Markdown compare-and-replace pilot: [Atomic Write Bridge README](../plugins/obsidian-atomic-write-bridge/README.md).',
              '- governed atomic note replacement: [contract](governed-note-replacement.md) and [Atomic Write Bridge README](../plugins/obsidian-atomic-write-bridge/README.md).',
              'hub bridge link',
          )
          write('docs/README.md', hub)

          hub_fr = read('docs/README.fr.md')
          hub_fr = replace_once(
              hub_fr,
              '| Pourquoi le MCP expose-t-il des fonctions Operon au lieu d’appeler la CLI ?   |',
              '| Comment fonctionne le remplacement atomique gouverné ?                        | [Contrat de remplacement gouverné](governed-note-replacement.fr.md)                       |\n| Pourquoi le MCP expose-t-il des fonctions Operon au lieu d’appeler la CLI ?   |',
              'hub FR authority row',
          )
          hub_fr = replace_once(
              hub_fr,
              '- pilote compare-and-replace Markdown : [README Atomic Write Bridge](../plugins/obsidian-atomic-write-bridge/README.md).',
              '- remplacement atomique gouverné : [contrat](governed-note-replacement.fr.md) et [README Atomic Write Bridge](../plugins/obsidian-atomic-write-bridge/README.md).',
              'hub FR bridge link',
          )
          write('docs/README.fr.md', hub_fr)

          matrix_fr = read('docs/runtime-capability-matrix.fr.md')
          matrix_fr = replace_once(
              matrix_fr,
              '[Guide d’exploitation](../OPERATIONS.fr.md), [Profil serveur headless]',
              '[Guide d’exploitation](../OPERATIONS.fr.md), [Remplacement gouverné](governed-note-replacement.fr.md), [Profil serveur headless]',
              'matrix FR related docs',
          )
          lines = matrix_fr.splitlines()
          update_index = next(i for i, line in enumerate(lines) if line.startswith('| Update note'))
          lines.insert(update_index + 1, '| Remplacement atomique gouverné         | CAS Atomic Write Bridge   | Idem tant que l’API et le Bridge répondent | Non                       | Non                             | Non                                 | Non                                                                        |')
          matrix_fr = '\n'.join(lines) + ('\n' if matrix_fr.endswith('\n') else '')
          matrix_fr = replace_once(
              matrix_fr,
              'La livraison du handoff est un contrat de transport, pas une capacité d’écriture',
              '''Les quatre outils `obsidian_note_replace_plan`,\n`obsidian_note_replace_apply`, `obsidian_note_replace_status` et\n`obsidian_note_replace_recover` sont enregistrés uniquement en `live`, ou en\n`hybrid` avec API disponible. Leur présence n’ouvre aucune écriture : politique\nMCP courante, frontmatter protégé, write gate du Bridge, identité backend et CAS\nSHA-256 restent effectifs.\n\nLa livraison du handoff est un contrat de transport, pas une capacité d’écriture''',
              'matrix FR runtime paragraph',
          )
          matrix_fr = replace_once(
              matrix_fr,
              '- Une validation d’écriture headless doit créer un nouveau brouillon',
              '- Le remplacement gouverné de note complète est live-only ; `recover` est une réconciliation/reprise du plan exact, jamais un undo.\n- Une validation d’écriture headless doit créer un nouveau brouillon',
              'matrix FR safety note',
          )
          write('docs/runtime-capability-matrix.fr.md', matrix_fr)

          adr = read('docs/adr/ADR-Common-Operation-Runtime.md')
          adr = replace_once(
              adr,
              '## Explicit exclusions',
              '''## Public 2.6 projection: governed note replacement\n\nThe existing `ObsidianNoteReplaceOperationAdapter`, Atomic Write backend, and\nprivate journal are owned by one application-lifecycle runtime. The runtime is\nconstructed once with the shared REST service, injected into the stdio server\nand every per-session HTTP MCP server, and closed explicitly during process\nshutdown. No session creates a competing journal or REST client.\n\nThe public projection remains domain-specific:\n\n- `obsidian_note_replace_plan`\n- `obsidian_note_replace_apply`\n- `obsidian_note_replace_status`\n- `obsidian_note_replace_recover`\n\nPlanning compares protected frontmatter and validates the future Markdown from\nthe same Bridge read that seals the before SHA-256. Apply and recover revalidate\nthe current MCP write policy before any possible effect. Recovery is exact-plan\nreconciliation/resumption, never undo. The guaranteed effect boundary is the\none target-note transition enforced by `Vault.process` CAS. Sync, watchers,\nplugins, indexers, and external automations remain outside that boundary.\n\nNo generic public `operation_*` surface is introduced. The candidate remains\nnon-mergeable for release purposes until the real Obsidian Desktop operator\ncanary passes.\n\n## Explicit exclusions''',
              'ADR public projection',
          )
          write('docs/adr/ADR-Common-Operation-Runtime.md', adr)
          PY
          git diff --check
          git diff --stat
      - run: npm ci
      - run: node scripts/test-governed-note-doc-contract.mjs
      - run: npm run test:docs
      - name: Commit scoped documentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.fr.md docs/README.md docs/README.fr.md docs/runtime-capability-matrix.fr.md docs/adr/ADR-Common-Operation-Runtime.md
          git diff --cached --check
          git commit -m "docs: preserve 2.5 authorities while documenting governed replacement"
          git push origin HEAD:feat/2.6.0-governed-note-replace
