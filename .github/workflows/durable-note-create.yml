name: M4 Durable Note Creation
on:
  pull_request:
    paths:
      - 'src/**'
      - 'plugins/obsidian-atomic-write-bridge/**'
      - 'scripts/**'
      - 'package*.json'
      - '.github/workflows/durable-note-create.yml'
permissions:
  contents: read
jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: node scripts/test-note-create-m4.mjs
      - run: node scripts/test-note-create-surface.mjs
      - run: npm --prefix plugins/obsidian-atomic-write-bridge ci
      - run: npm --prefix plugins/obsidian-atomic-write-bridge run check
