name: Patch documentation helper phrase

on:
  push:
    branches:
      - feat/2.6.0-governed-note-replace

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/2.6.0-governed-note-replace
          fetch-depth: 2
      - name: Keep canonical recovery phrase contiguous
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/restore-2.6-doc-scope.yml')
          text = path.read_text()
          old = 'Recovery is exact-plan\\nreconciliation/resumption, never undo.'
          new = 'Recovery uses exact-plan reconciliation/resumption and is never undo.'
          if old in text:
              path.write_text(text.replace(old, new, 1))
          else:
              assert new in text, 'canonical phrase not found'
          PY
          git diff --check
      - name: Commit helper correction when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/restore-2.6-doc-scope.yml
          git diff --cached --check
          git commit -m "chore: align documentation validation phrase"
          git push origin HEAD:feat/2.6.0-governed-note-replace
